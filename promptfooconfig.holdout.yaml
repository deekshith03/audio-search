description: 'Conversational Audio Hybrid Search: holdout split (9 queries)'
prompts:
- '{{query}}'
providers:
- id: python:evals/search_provider.py
  label: Hybrid
  config:
    mode: hybrid
    top_k: 5
- id: python:evals/search_provider.py
  label: Lexical (FTS)
  config:
    mode: lexical
    top_k: 5
- id: python:evals/search_provider.py
  label: Dense (pgvector)
  config:
    mode: dense
    top_k: 5
tests:
- description: '[HSF-01] SINGLE_FILE: alternative operating system to macos and windows...'
  vars:
    query: alternative operating system to macos and windows
    query_id: HSF-01
    category: single_file
    archetype: holdout_exact
    expected_moments:
    - file_id: audio_01_lex_dhh_omarchy.wav
      turn_id: 6
      speaker: DHH
      start_seconds: 144.84
      end_seconds: 148.0
      matched_text: It’s an alternative operating system to macOS and Windows
      turn_start_seconds: 138.0
      turn_end_seconds: 149.0
      span_source: wav2vec2_forced_alignment_of_reference_turn (WAV2VEC2_ASR_BASE_960H)
    hard_negatives: []
  assert:
  - type: python
    value: file://evals/assertions.py
- description: '[HNM-01] NEAR_MISS: world economy becoming a function of lab economics...'
  vars:
    query: world economy becoming a function of lab economics
    query_id: HNM-01
    category: near_miss
    archetype: holdout_exact
    expected_moments:
    - file_id: audio_04_macroeconomics_semiconductor.wav
      turn_id: 3
      speaker: Dwarkesh Patel
      start_seconds: 15.2
      end_seconds: 20.27
      matched_text: where the world economy is headed is more and more becoming a function of where lab economics are headed
      turn_start_seconds: 14.7
      turn_end_seconds: 37.0
      span_source: wav2vec2_forced_alignment_of_reference_turn (WAV2VEC2_ASR_BASE_960H)
    hard_negatives:
    - file_id: audio_04_macroeconomics_semiconductor.wav
      turn_id: 5
      speaker: Dwarkesh Patel
      start_seconds: 203.7
      end_seconds: 230.6
      reason: Same speaker also talks about labs and compute share, but about centralization of compute, not the world economy
        framing.
  assert:
  - type: python
    value: file://evals/assertions.py
