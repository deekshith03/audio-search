name: audio-search

services:
  app:
    build: .
    image: audio-search:latest
    env_file:
      - path: .env
        required: false
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-600}
      DATABASE_URL: postgresql://${POSTGRES_USER:-audio}:${POSTGRES_PASSWORD:-audio}@db:5432/${POSTGRES_DB:-audio_search}
    ports:
      # Local only by default (the app has no login); APP_BIND=0.0.0.0 shares it on the network.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8501}:8501"
    volumes:
      - models:/models
      - app_data:/app/data
      # Golden-set speaker names typed in the app survive a rebuild; seeded from the image on first use.
      - golden_labels:/app/dataset/speaker_labels
    depends_on:
      db:
        condition: service_healthy

  # ParadeDB = PostgreSQL 17 + pg_search (BM25) + pgvector; schema via `python -m src.db.migrate`.
  db:
    image: paradedb/paradedb:0.25.10-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audio}
      POSTGRES_DB: ${POSTGRES_DB:-audio_search}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-audio} -d ${POSTGRES_DB:-audio_search}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  models:
  app_data:
  golden_labels:
  pgdata:
